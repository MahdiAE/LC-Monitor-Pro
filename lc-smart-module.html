<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LC Smart Module — Mechanism · Evaluation · Monitoring</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c3aed'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3ELC%3C/text%3E%3C/svg%3E">
<style>html,body{margin:0;background:#f6f7fb}</style>
<!--
  LC SMART MODULE — standalone, embeddable, single-file prototype (vanilla JS, no build, localStorage).
  Saudi Local Content (LCGPA). Two sectors: Government entities (Res.245) + Portfolio companies (PIF MUSAHAMA).
  Three working modules: Mechanism Identifier · Bid Evaluation · Contract Monitor.  Bilingual EN/AR, light/dark.
  All rule numbers live in REGIMES (the "rules pack") — sourced in LC-TOOL-RESEARCH.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================ DESIGN TOKENS ============================ */
#lcm-app{
  --fn:'Bricolage Grotesque',system-ui,sans-serif;
  --far:'IBM Plex Sans Arabic','Bricolage Grotesque',sans-serif;
  --fm:'JetBrains Mono',ui-monospace,monospace;
  --brand1:#2563eb; --brand2:#7c3aed;
  --grad:linear-gradient(135deg,#2563eb 0%,#7c3aed 100%);
  --grad-soft:linear-gradient(135deg,rgba(37,99,235,.12),rgba(124,58,237,.12));
  --bg:#f6f7fb; --bg2:#eef1f7; --surface:#ffffff; --surface2:#f8fafc;
  --ink:#0f1729; --ink2:#475069; --ink3:#7a8299; --line:#e4e8f0; --line2:#eef1f6;
  --ok:#0f9d58; --ok-bg:#e7f6ee; --warn:#c77700; --warn-bg:#fdf3e2;
  --bad:#d23a3a; --bad-bg:#fbe9e9; --neutral:#5566aa; --neutral-bg:#eef0fb;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.18);
  --shadow-lg:0 2px 6px rgba(16,24,40,.06),0 24px 48px -20px rgba(16,24,40,.28);
  --r:14px; --r-sm:10px; --r-lg:20px;
}
#lcm-app.dark{
  --bg:#0b0f1a; --bg2:#0f1424; --surface:#141a2b; --surface2:#1a2238;
  --ink:#eef1f8; --ink2:#aab3cc; --ink3:#7682a0; --line:#262f47; --line2:#1e273c;
  --ok:#3ddc84; --ok-bg:#0f2a1d; --warn:#ffc266; --warn-bg:#2c2310;
  --bad:#ff7a7a; --bad-bg:#2c1414; --neutral:#9fb0ff; --neutral-bg:#171d33;
  --grad-soft:linear-gradient(135deg,rgba(37,99,235,.18),rgba(124,58,237,.18));
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.7);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 32px 60px -24px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
#lcm-app{font-family:var(--fn); background:var(--bg); color:var(--ink); min-height:100vh; margin:0;
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5; letter-spacing:-.01em}
#lcm-app.rtl{direction:rtl; font-family:var(--far)}
#lcm-app.rtl .lcm-num,#lcm-app.rtl .mono{direction:ltr; unicode-bidi:plaintext}
#lcm-app button,#lcm-app input,#lcm-app select{font-family:inherit}
#lcm-app .mono{font-family:var(--fm)}
#lcm-app h1,#lcm-app h2,#lcm-app h3,#lcm-app h4{margin:0; font-weight:700; letter-spacing:-.02em}
#lcm-app a{color:var(--brand1); text-decoration:none; cursor:pointer}

/* ============================ SHELL ============================ */
#lcm-app .lcm-top{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:18px; padding:12px 22px;
  background:color-mix(in srgb,var(--surface) 86%,transparent); backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}
#lcm-app .lcm-brand{display:flex; align-items:center; gap:11px; font-weight:800; font-size:17px}
#lcm-app .lcm-logo{width:34px; height:34px; border-radius:10px; background:var(--grad); display:grid; place-items:center;
  color:#fff; font-weight:800; font-size:15px; box-shadow:0 4px 14px -4px rgba(124,58,237,.6); flex:none}
#lcm-app .lcm-brand small{display:block; font-size:11px; font-weight:500; color:var(--ink3); letter-spacing:0}
#lcm-app .lcm-spacer{flex:1}
#lcm-app .lcm-ctl{display:flex; align-items:center; gap:8px}
#lcm-app .lcm-iconbtn{width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink2); cursor:pointer; font-size:15px; display:grid; place-items:center; transition:.15s}
#lcm-app .lcm-iconbtn:hover{border-color:var(--brand1); color:var(--brand1); transform:translateY(-1px)}
#lcm-app .lcm-regime{display:flex; gap:4px; padding:4px; background:var(--bg2); border:1px solid var(--line); border-radius:12px}
#lcm-app .lcm-regime button{border:0; background:transparent; padding:7px 14px; border-radius:9px; color:var(--ink2);
  font-weight:600; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:.15s}
#lcm-app .lcm-regime button .dot{width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.5}
#lcm-app .lcm-regime button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
#lcm-app .lcm-regime button.on .dot{opacity:1; background:var(--brand2)}

#lcm-app .lcm-body{display:flex}
#lcm-app .lcm-nav{position:sticky; top:60px; width:232px; flex:none; padding:18px 14px; height:calc(100vh - 60px);
  border-right:1px solid var(--line); display:flex; flex-direction:column; gap:3px}
#lcm-app.rtl .lcm-nav{border-right:0; border-left:1px solid var(--line)}
#lcm-app .lcm-nav .navh{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink3); font-weight:600; padding:14px 12px 6px}
#lcm-app .lcm-nav a{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; color:var(--ink2);
  font-weight:600; font-size:14px; transition:.15s}
#lcm-app .lcm-nav a .ic{font-size:17px; width:20px; text-align:center}
#lcm-app .lcm-nav a:hover{background:var(--bg2); color:var(--ink)}
#lcm-app .lcm-nav a.on{background:var(--grad-soft); color:var(--brand2)}
#lcm-app.dark .lcm-nav a.on{color:#c4b5fd}
#lcm-app .lcm-nav .tag{margin-inline-start:auto; font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; background:var(--neutral-bg); color:var(--neutral)}
#lcm-app .lcm-main{flex:1; padding:26px 30px 80px; min-width:0; max-width:1200px}
#lcm-app .lcm-page{display:none; animation:fade .35s ease}
#lcm-app .lcm-page.on{display:block}
@keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

#lcm-app .lcm-ph{margin-bottom:22px}
#lcm-app .lcm-ph h1{font-size:27px; display:flex; align-items:center; gap:11px}
#lcm-app .lcm-ph p{color:var(--ink2); margin:7px 0 0; max-width:64ch; font-size:14.5px}
#lcm-app .lcm-eyebrow{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--brand2); margin-bottom:6px}

/* ============================ PRIMITIVES ============================ */
#lcm-app .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
#lcm-app .pad{padding:20px}
#lcm-app .grid{display:grid; gap:16px}
#lcm-app .g-kpi{grid-template-columns:repeat(4,1fr)}
#lcm-app .g-2{grid-template-columns:1.35fr .85fr}
#lcm-app .g-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1080px){#lcm-app .g-kpi{grid-template-columns:repeat(2,1fr)} #lcm-app .g-2,#lcm-app .g-3{grid-template-columns:1fr} #lcm-app .lcm-nav{display:none}}

#lcm-app .kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; position:relative; overflow:hidden; box-shadow:var(--shadow); transition:.2s}
#lcm-app .kpi:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:color-mix(in srgb,var(--brand2) 35%,var(--line))}
#lcm-app .kpi .kt{font-size:12.5px; color:var(--ink2); font-weight:600; display:flex; align-items:center; gap:7px}
#lcm-app .kpi .kt .ki{width:28px; height:28px; border-radius:8px; background:var(--grad-soft); display:grid; place-items:center; font-size:14px; color:var(--brand2)}
#lcm-app .kpi .kv{font-size:30px; font-weight:800; margin-top:12px; letter-spacing:-.03em; font-feature-settings:"tnum"}
#lcm-app .kpi .ks{font-size:12px; color:var(--ink3); margin-top:3px; font-weight:500}
#lcm-app .kpi .spark{position:absolute; inset-inline-end:14px; top:16px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px}

#lcm-app .ring-wrap{position:relative; display:grid; place-items:center}
#lcm-app .ring{width:118px; height:118px; border-radius:50%; background:conic-gradient(var(--gc,var(--brand2)) calc(var(--p)*1%), var(--line2) 0)}
#lcm-app .ring::before{content:''; position:absolute; width:88px; height:88px; border-radius:50%; background:var(--surface)}
#lcm-app .ring-val{position:relative; font-size:24px; font-weight:800; font-feature-settings:"tnum"; text-align:center}
#lcm-app .ring-val small{display:block; font-size:10.5px; color:var(--ink3); font-weight:600}

#lcm-app .barrow{display:flex; align-items:center; gap:10px; margin:11px 0; font-size:13px}
#lcm-app .barrow .lbl{width:160px; flex:none; color:var(--ink2); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#lcm-app .barrow .track{flex:1; height:9px; border-radius:20px; background:var(--line2); overflow:hidden}
#lcm-app .barrow .fill{height:100%; border-radius:20px; background:var(--grad); transition:width .8s cubic-bezier(.2,.8,.2,1)}
#lcm-app .barrow .vn{width:34px; text-align:end; font-weight:700; font-feature-settings:"tnum"; color:var(--ink)}

#lcm-app label.fl{display:block; font-size:12.5px; font-weight:600; color:var(--ink2); margin:0 0 7px}
#lcm-app input[type=text],#lcm-app input[type=number],#lcm-app input[type=date],#lcm-app select{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface2);
  color:var(--ink); font-size:14.5px; transition:.15s; font-feature-settings:"tnum"}
#lcm-app input:focus,#lcm-app select:focus{outline:0; border-color:var(--brand1); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand1) 18%,transparent); background:var(--surface)}
#lcm-app .field{margin-bottom:17px}
#lcm-app .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px}
#lcm-app .field-row.three{grid-template-columns:repeat(3,1fr)}
#lcm-app .hint{font-size:12px; color:var(--ink3); margin-top:6px}

#lcm-app .seg{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
#lcm-app .seg.two{grid-template-columns:repeat(2,1fr)}
#lcm-app .seg .opt{border:1.5px solid var(--line); border-radius:var(--r-sm); padding:13px 12px; cursor:pointer; background:var(--surface2); transition:.15s; text-align:center}
#lcm-app .seg .opt:hover{border-color:color-mix(in srgb,var(--brand2) 40%,var(--line))}
#lcm-app .seg .opt.on{border-color:var(--brand2); background:var(--grad-soft); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand2) 14%,transparent)}
#lcm-app .seg .opt .oi{font-size:21px; margin-bottom:5px}
#lcm-app .seg .opt .ol{font-size:13.5px; font-weight:700}
#lcm-app .seg .opt .od{font-size:11px; color:var(--ink3); margin-top:2px}

#lcm-app .tgl{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 15px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface2); margin-bottom:11px}
#lcm-app .tgl .tt{font-size:13.5px; font-weight:600}
#lcm-app .tgl .td{font-size:11.5px; color:var(--ink3); margin-top:2px}
#lcm-app .sw{width:42px; height:24px; border-radius:20px; background:var(--line); position:relative; cursor:pointer; flex:none; transition:.2s; border:0}
#lcm-app .sw::after{content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; top:3px; inset-inline-start:3px; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3)}
#lcm-app .sw.on{background:var(--brand2)}
#lcm-app .sw.on::after{inset-inline-start:21px}
#lcm-app.rtl .sw::after{inset-inline-start:auto; inset-inline-end:3px}
#lcm-app.rtl .sw.on::after{inset-inline-end:21px}

#lcm-app .btn{display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:14px; cursor:pointer; transition:.15s}
#lcm-app .btn:hover{border-color:var(--brand1); transform:translateY(-1px)}
#lcm-app .btn.primary{background:var(--grad); color:#fff; border:0; box-shadow:0 6px 18px -6px rgba(124,58,237,.55)}
#lcm-app .btn.primary:hover{box-shadow:0 10px 26px -8px rgba(124,58,237,.7)}
#lcm-app .btn.ghost{background:transparent}
#lcm-app .btn.sm{padding:7px 12px; font-size:13px}
#lcm-app .btn.lg{padding:13px 24px; font-size:15px}
#lcm-app .btn.danger{color:var(--bad); border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}

#lcm-app .pill{font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px; display:inline-flex; align-items:center; gap:5px}
#lcm-app .st-ok{background:var(--ok-bg); color:var(--ok)} #lcm-app .st-warn{background:var(--warn-bg); color:var(--warn)}
#lcm-app .st-bad{background:var(--bad-bg); color:var(--bad)} #lcm-app .st-neutral{background:var(--neutral-bg); color:var(--neutral)}

#lcm-app table.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
#lcm-app table.tbl th{text-align:start; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink3); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--line)}
#lcm-app table.tbl td{padding:11px 12px; border-bottom:1px solid var(--line2)}
#lcm-app table.tbl tr:hover td{background:var(--surface2)}
#lcm-app table.tbl tr.win td{background:color-mix(in srgb,var(--ok) 9%,var(--surface))}

#lcm-app .sec-h{display:flex; align-items:center; gap:10px; margin:26px 0 14px}
#lcm-app .sec-h h3{font-size:16px}
#lcm-app .sec-h .ln{flex:1; height:1px; background:var(--line)}
#lcm-app .empty{text-align:center; padding:40px 20px; color:var(--ink3)}
#lcm-app .empty .ei{font-size:38px; margin-bottom:10px; opacity:.5}
#lcm-app .foot{margin-top:40px; padding-top:18px; border-top:1px solid var(--line); font-size:12px; color:var(--ink3); display:flex; gap:16px; flex-wrap:wrap}

/* subtabs */
#lcm-app .subtabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--line)}
#lcm-app .subtabs button{border:0; background:transparent; padding:10px 14px; font-weight:600; font-size:14px; color:var(--ink2); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px}
#lcm-app .subtabs button.on{color:var(--brand2); border-color:var(--brand2)}

/* result panel (mechanism) */
#lcm-app .res-hero{background:var(--grad); color:#fff; border-radius:var(--r-lg); padding:24px 26px; position:relative; overflow:hidden}
#lcm-app .res-hero::after{content:''; position:absolute; inset-inline-end:-40px; top:-40px; width:200px; height:200px; background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
#lcm-app .res-hero .rl{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; opacity:.85}
#lcm-app .res-hero .rm{font-size:23px; font-weight:800; margin-top:7px; line-height:1.25}
#lcm-app .res-hero .rsub{opacity:.92; margin-top:8px; font-size:14px}
#lcm-app .res-hero .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:15px}
#lcm-app .res-hero .chip{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25); padding:5px 12px; border-radius:20px; font-size:12.5px; font-weight:600}
#lcm-app .mech-card{border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; margin-top:13px; background:var(--surface)}
#lcm-app .mech-card .mh{display:flex; align-items:center; gap:11px}
#lcm-app .mech-card .mh .mi{width:38px; height:38px; border-radius:10px; background:var(--grad-soft); color:var(--brand2); display:grid; place-items:center; font-size:18px; flex:none}
#lcm-app .mech-card .mh .mt{font-weight:700; font-size:15.5px}
#lcm-app .mech-card .mh .mtype{font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; margin-inline-start:auto}
#lcm-app .mtype.primary{background:var(--neutral-bg); color:var(--neutral)}
#lcm-app .mtype.overlay{background:var(--warn-bg); color:var(--warn)}
#lcm-app .mech-card .md{font-size:13.5px; color:var(--ink2); margin-top:9px}
#lcm-app .mech-card .params{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
#lcm-app .pp{font-size:12px; font-family:var(--fm); background:var(--surface2); border:1px solid var(--line); padding:5px 10px; border-radius:8px; color:var(--ink2)}
#lcm-app .pp b{color:var(--ink)}
#lcm-app .why{margin-top:16px; padding:16px 18px; border-radius:var(--r); background:var(--surface2); border:1px solid var(--line)}
#lcm-app .why h4{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink3); margin-bottom:10px}
#lcm-app .why ul{margin:0; padding:0}
#lcm-app .why li{font-size:13.5px; color:var(--ink2); margin:7px 0; padding-inline-start:24px; position:relative; list-style:none}
#lcm-app .why li::before{content:'→'; position:absolute; inset-inline-start:0; color:var(--brand2); font-weight:700}
#lcm-app .obl{display:flex; gap:13px; padding:13px 0; border-bottom:1px solid var(--line2)}
#lcm-app .obl:last-child{border-bottom:0}
#lcm-app .obl .oic{width:34px; height:34px; border-radius:9px; display:grid; place-items:center; flex:none; font-size:15px; background:var(--neutral-bg); color:var(--neutral)}
#lcm-app .obl .ot{font-weight:700; font-size:14px}
#lcm-app .obl .ow{font-size:12.5px; color:var(--ink2); margin-top:2px}
#lcm-app .obl .odue{margin-inline-start:auto; text-align:end; font-size:12px; font-weight:700; color:var(--brand2); white-space:nowrap}

/* bidder builder */
#lcm-app .bidder{border:1px solid var(--line); border-radius:var(--r); padding:15px; margin-bottom:12px; background:var(--surface)}
#lcm-app .bidder .bh{display:flex; align-items:center; gap:10px; margin-bottom:12px}
#lcm-app .bidder .bh input{font-weight:700}
#lcm-app .bd-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:11px}
@media(max-width:760px){#lcm-app .bd-grid{grid-template-columns:repeat(2,1fr)}}
#lcm-app .chkrow{display:flex; gap:16px; flex-wrap:wrap; margin-top:12px}
#lcm-app .chk{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--ink2); cursor:pointer}
#lcm-app .chk input{width:16px; height:16px; accent-color:var(--brand2)}
#lcm-app .scorebar{height:7px; border-radius:20px; background:var(--line2); overflow:hidden; min-width:60px}
#lcm-app .scorebar i{display:block; height:100%; background:var(--grad); border-radius:20px}
#lcm-app .badge-rank{width:24px; height:24px; border-radius:7px; background:var(--grad-soft); color:var(--brand2); display:inline-grid; place-items:center; font-weight:800; font-size:12px}

/* timeline */
#lcm-app .tl{position:relative; padding-inline-start:26px}
#lcm-app .tl::before{content:''; position:absolute; inset-inline-start:8px; top:6px; bottom:6px; width:2px; background:var(--line)}
#lcm-app .tl .ti{position:relative; padding:0 0 18px}
#lcm-app .tl .ti::before{content:''; position:absolute; inset-inline-start:-22px; top:3px; width:14px; height:14px; border-radius:50%; background:var(--surface); border:2.5px solid var(--ink3)}
#lcm-app .tl .ti.received::before{border-color:var(--ok); background:var(--ok)}
#lcm-app .tl .ti.overdue::before{border-color:var(--bad); background:var(--bad)}
#lcm-app .tl .ti.due::before{border-color:var(--warn); background:var(--warn)}
#lcm-app .tl .ti .tt{font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px}
#lcm-app .tl .ti .tw{font-size:12.5px; color:var(--ink3); margin-top:2px}

/* capacity bar (penalty vs cap) */
#lcm-app .capbar{height:26px; border-radius:8px; background:var(--line2); position:relative; overflow:hidden; margin:10px 0}
#lcm-app .capbar i{position:absolute; inset-inline-start:0; top:0; bottom:0; background:linear-gradient(90deg,var(--warn),var(--bad)); border-radius:8px; transition:width .8s}
#lcm-app .capbar .capline{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); opacity:.6}
#lcm-app .capbar .captxt{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink); font-feature-settings:"tnum"}

/* scaffold blocks (flow steps) */
#lcm-app .flowsteps{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px}
#lcm-app .flowsteps .fs{flex:1; min-width:180px; border:1px solid var(--line); border-radius:var(--r); padding:15px; background:var(--surface2)}
#lcm-app .flowsteps .fs .fn{width:26px; height:26px; border-radius:8px; background:var(--grad); color:#fff; display:grid; place-items:center; font-weight:800; font-size:13px; margin-bottom:9px}
#lcm-app .flowsteps .fs .ft{font-weight:700; font-size:13.5px}
#lcm-app .flowsteps .fs .fd{font-size:12px; color:var(--ink3); margin-top:4px}

/* list rows */
#lcm-app .lrow{display:flex; align-items:center; gap:14px; padding:14px 16px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); margin-bottom:10px; cursor:pointer; transition:.15s}
#lcm-app .lrow:hover{border-color:var(--brand1); transform:translateX(2px); box-shadow:var(--shadow)}
#lcm-app.rtl .lrow:hover{transform:translateX(-2px)}
#lcm-app .lrow .lic{width:42px; height:42px; border-radius:11px; background:var(--grad-soft); color:var(--brand2); display:grid; place-items:center; font-size:18px; flex:none}
#lcm-app .lrow .lt{font-weight:700; font-size:15px}
#lcm-app .lrow .lw{font-size:12.5px; color:var(--ink3); margin-top:2px}
#lcm-app .lrow .lr{margin-inline-start:auto; text-align:end}

/* modal */
#lcm-app .modal-bg{position:fixed; inset:0; background:rgba(8,12,22,.55); backdrop-filter:blur(4px); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:40px 20px; overflow:auto}
#lcm-app .modal-bg.on{display:flex}
#lcm-app .modal{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); width:100%; max-width:680px; box-shadow:var(--shadow-lg); animation:fade .25s ease}
#lcm-app .modal .mhd{display:flex; align-items:center; gap:12px; padding:20px 22px; border-bottom:1px solid var(--line)}
#lcm-app .modal .mhd h3{font-size:18px}
#lcm-app .modal .mbd{padding:22px}
#lcm-app .modal .mft{padding:16px 22px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end}
/* mandatory list + spinner */
#lcm-app .lcm-spin{width:38px; height:38px; border:3px solid var(--line); border-top-color:var(--brand2); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
#lcm-app .loading{padding:54px 20px; text-align:center; color:var(--ink3)}
#lcm-app .loading .lt{margin-top:14px; font-size:13px; font-weight:600}
#lcm-app .mlq{font-weight:700; font-size:14.5px; margin:0 0 10px; display:flex; align-items:center; gap:9px}
#lcm-app .mlq .qn{width:24px; height:24px; border-radius:7px; background:var(--grad); color:#fff; display:grid; place-items:center; font-size:12px; font-weight:800; flex:none}
#lcm-app .matchbar{height:6px; width:52px; border-radius:20px; background:var(--line2); overflow:hidden; display:inline-block; vertical-align:middle}
#lcm-app .matchbar i{display:block; height:100%; background:var(--grad)}
#lcm-app .mtag{font-family:var(--fm); font-size:11px; color:var(--ink3)}
#lcm-app input.rule-edit{width:62px; padding:6px 8px; font-size:13px; text-align:center; display:inline-block}
#lcm-app td.editable{background:color-mix(in srgb,var(--brand2) 6%,transparent)}
#lcm-app .editnote{font-size:12px; color:var(--ink3); margin-top:2px}
</style>

/* ===================== DECISION ENGINE ===================== */
function identify(rk, inp){

      else { add('primary','minlc'); out.why.push(L('High-value '+(isMixed?'mixed':'non-supply')+' tender, not an LCGPA-excluded activity → Local Content Minimum Threshold (bids below the required minimum are disqualified), evaluated with the LC-weight model (60% price / 40% LC).','منافسة '+(isMixed?'مختلطة':'غير توريدية')+' عالية القيمة وليست من الأنشطة المستثناة ← الحد الأدنى المطلوب للمحتوى المحلي (تُستبعد العروض دون الحد)، ويُقيّم بنموذج وزن المحتوى المحلي (60% سعر / 40% محتوى محلي).')); }

    else { add('primary','npp'); out.why.push(L((isMixed?'Mixed (below high-value)':'Supply')+' tender → National Product Price Preference (10%) on non-listed national products.','منافسة '+(isMixed?'مختلطة دون الحد':'توريد')+' ← الأفضلية السعرية للمنتج الوطني (10%) على المنتجات الوطنية غير المدرجة.')); }
  } else { /* pc — PIF MUSAHAMA (Jan 2025) */
    add('overlays','npp'); out.why.push(L('PIF MUSAHAMA: the 10% national-product price preference applies to all contracts.','مساهمة - PIF: تُطبّق الأفضلية السعرية 10% للمنتج الوطني على جميع العقود.'));

    } else { var i=out.overlays.findIndex(function(x){return x.id==='npp';}); if(i>=0) out.overlays.splice(i,1); add('primary','npp');
      out.why.push(L((isMixed?'Mixed (below SAR 50M)':'Supply')+' → National Product Price Preference (10%) primary + Mandatory List; no weighted-LC formula required.','منافسة '+(isMixed?'مختلطة دون 50 مليون':'توريد')+' ← الأفضلية السعرية للمنتج الوطني (10%) كآلية أساسية + القائمة الإلزامية؛ دون معادلة وزن المحتوى.')); }

    if(R.listedBonus) out.params.push({k:L('Listed bonus','حافز المدرجة'),v:'+'+(R.listedBonus*100)+'%'});

  }
  if(out.overlays.some(function(m){return m.id==='npp';})||prim.indexOf('npp')>=0)
    O.push({icon:'⛳',t:L('National-product final supply report','التقرير النهائي لتوريد المنتجات الوطنية'),w:L('Proves national origin.','يثبت المنشأ الوطني.'),due:L('End + '+(R.supplyFinalDays||30)+'d','النهاية + '+(R.supplyFinalDays||30)+' يوم')});
  if(out.overlays.some(function(m){return m.id==='mandatory';}))
    O.push({icon:'❖',t:L('Mandatory-List compliance monitoring','مراقبة الالتزام بالقائمة الإلزامية'),w:L('Reject off-list goods unless exempted.','رفض السلع خارج القائمة ما لم تُستثنَ.'),due:L('During execution','أثناء التنفيذ')});

/* ===================== EVALUATION ENGINE ===================== */
function computeEval(ev){
  var R=REGIMES[ev.regime], mech=ev.mechanism, gate=+ev.techGate||0;
  var bids=(ev.bidders||[]).map(function(b){return Object.assign({},b);});
  bids.forEach(function(b){
    b.excludeReason='';
    if(!(+b.price>0)){ b.qualified=false; b.excludeReason=L('no price','لا سعر'); return; }
    if(b.mlCompliant===false){ b.qualified=false; b.excludeReason=L('not ML-compliant','غير ملتزم بالقائمة'); return; }
    if(mechNeedsLC(mech) && !(+b.targetLC>0)){ b.qualified=false; b.excludeReason=L('no target LC%','لا نسبة مستهدفة'); return; }
    if(mech==='minlc'){ var _mt=+ev.minTarget||0, _mb=+ev.minBaseline||0;
      if(_mt>0 && (+b.targetLC||0) < _mt){ b.qualified=false; b.excludeReason=L('target < min '+_mt+'%','المستهدف < الحد '+_mt+'%'); return; }
      if(_mb>0 && (+b.baseline||0) < _mb){ b.qualified=false; b.excludeReason=L('baseline < min '+_mb+'%','خط الأساس < الحد '+_mb+'%'); return; } }
    if(gate>0 && (+b.techScore||0) < gate){ b.qualified=false; b.excludeReason=L('tech < '+gate,'فني < '+gate); return; }
    b.qualified=true;
  });
  var qual=bids.filter(function(b){return b.qualified;});
  function adj(b){ var p=+b.price||0;
    if(mech==='sme') return b.isSME? p : p*(1+R.smePref);
    if(mech==='npp'){ var s=Math.min(1,Math.max(0,(+b.nppShare||0)/100)); return p + R.nppPref*p*(1-s); }
    return p; }
  qual.forEach(function(b){ b.adjPrice=adj(b); });
  var lowAdj=qual.length?Math.min.apply(null,qual.map(function(b){return b.adjPrice;})):0;
  var lowRaw=qual.length?Math.min.apply(null,qual.map(function(b){return +b.price||0;})):0;
  var maxTech=qual.length?Math.max.apply(null,qual.map(function(b){return +b.techScore||0;})):0;
  qual.forEach(function(b){
    b.priceScore=b.adjPrice?lowAdj/b.adjPrice:0;
    b.relTech=maxTech?(+b.techScore||0)/maxTech:0;
    if(mechNeedsLC(mech)){
      var t=(+b.targetLC||0)/100, base=(+b.baseline||0)/100;
      b.lcScore=R.targetSplit*t + R.baselineSplit*base + (b.isListed?R.listedBonus:0);
      b.financial=R.priceWeight*b.priceScore + R.lcWeight*b.lcScore;
    } else { b.lcScore=null; b.financial=b.priceScore; }
    b.finalScore=(+ev.techWeight/100)*b.relTech + (+ev.finWeight/100)*b.financial;
  });
  qual.sort(function(a,b){ return b.finalScore-a.finalScore || (a.price-b.price) || ((b.baseline||0)-(a.baseline||0)); });
  qual.forEach(function(b){ b.gap=lowRaw?((b.price-lowRaw)/lowRaw):0; });
  var winner=null, skipped=[];
  for(var i=0;i<qual.length;i++){ if(qual[i].gap<=R.awardGapCap+1e-9){ winner=qual[i]; break; } else skipped.push(qual[i]); }
  return {regime:ev.regime, mech:mech, qualified:qual, excluded:bids.filter(function(b){return !b.qualified;}), winner:winner, skipped:skipped, lowRaw:lowRaw, lowAdj:lowAdj, gate:gate};
}

/* ===================== MONITORING ENGINE ===================== */
function mechFlags(c){ var id=c.mechanism; return {lc:mechNeedsLC(id), npp:!!c.hasNPP||id==='npp', ml:!!c.hasMandatory, sme:id==='sme'}; }
function buildReports(c){
  var R=REGIMES[c.regime], start=pd(c.startDate)||new Date(), months=+c.durationMonths||0;
  var end=addM(start,months), award=pd(c.awardDate)||start, f=mechFlags(c), reps=[];
  var count=0;
  if(f.lc){ if(months<=12)count=1; else if(months<=24)count=2; else count=Math.floor(months/12)+1; }
  var base=+c.baseline||0, committed=+c.committedLC||0;
  if(f.lc && months>12) reps.push({key:'plan',type:'plan',label:L('Improvement plan','خطة التحسين'),due:addD(award,R.planDays),target:null});
  if(f.lc && count>0){
    for(var i=1;i<count;i++){ var tgt=base+(committed-base)*(i/count);
      reps.push({key:'p'+i,type:'periodic',year:i,label:L('Periodic report Y'+i,'تقرير دوري سنة '+i),due:addM(start,i*12),target:Math.round(tgt*10)/10}); }
    reps.push({key:'final',type:'final',label:L('Final LC report','التقرير النهائي'),due:end,target:committed});
  }
  if(f.npp) reps.push({key:'npp',type:'npp',label:L('National-product supply report','تقرير توريد المنتجات الوطنية'),due:addD(end,R.supplyFinalDays||30),target:null});
  if(f.ml) reps.push({key:'mlnp',type:'mlnp',label:L('Mandatory-List supply report','تقرير توريد القائمة الإلزامية'),due:addD(end,R.supplyFinalDays||30),target:null});
  reps.forEach(function(r){ r.reminder=addD(r.due,-15); });
  return {reports:reps, end:end, count:count};
}
function rstatus(r){ if(r.received)return 'received'; var dt=daysTo(pd(r.due)); if(dt<0)return 'overdue'; if(dt<=15)return 'due'; return 'upcoming'; }
function recalc(c){
  var R=REGIMES[c.regime], pen=R.pen, amt=+c.amount||0, fines=[], debar=[];
  (c.reports||[]).forEach(function(r){
    var st=rstatus(r);
    if(r.type==='periodic' && r.received && r.actual!=null){ var g=((r.target||0)-(+r.actual))/100;
      if(g>pen.gapTrigger){ fines.push({type:L('Periodic shortfall','عجز دوري'),ref:r.label,amount:Math.min(pen.devRate*amt*g,pen.perFineCap*amt),pct:(g*100).toFixed(1)}); } }
    if(r.type==='final'){
      if(!r.received && st==='overdue') fines.push({type:L('Final report not submitted','عدم تقديم التقرير النهائي'),ref:r.label,amount:pen.perFineCap*amt,pct:null});
      if(r.received && r.actual!=null){ var gf=((+c.committedLC||0)-(+r.actual))/100;
        if(gf>pen.gapTrigger) fines.push({type:L('LC deviation','انحراف المحتوى المحلي'),ref:r.label,amount:Math.min(pen.devRate*amt*gf,pen.perFineCap*amt),pct:(gf*100).toFixed(1)});
        if(gf> (pen.debarSingleLC)) debar.push(L('LC shortfall '+(gf*100).toFixed(1)+'% > '+(pen.debarSingleLC*100)+'% → debarment / blacklist referral','عجز '+(gf*100).toFixed(1)+'% > '+(pen.debarSingleLC*100)+'% ← إحالة للحرمان')); }
    }
    if(r.type==='npp' && !r.received && st==='overdue'){ var npp=(+c.natProd||0); fines.push({type:L('NPP report not submitted','عدم تقديم تقرير المنتجات الوطنية'),ref:r.label,amount:Math.min(pen.devRate*npp,pen.perFineCap*amt),pct:null}); }
    if(r.type==='mlnp' && !r.received && st==='overdue'){ var ml=(+c.mandatoryList||0); fines.push({type:L('Mandatory-List report not submitted','عدم تقديم تقرير القائمة'),ref:r.label,amount:Math.min(pen.devRate*ml,pen.perFineCap*amt),pct:null}); }
  });
  var finalR=(c.reports||[]).find(function(r){return r.type==='final';});
  if(finalR && !finalR.received && rstatus(finalR)==='overdue') debar.push(L('Final report not submitted → debarment referral','عدم تقديم التقرير النهائي ← إحالة للحرمان'));
  var raw=fines.reduce(function(s,f){return s+f.amount;},0);
  var capped=Math.min(raw, pen.aggregateCap*amt);
  return {fines:fines, raw:raw, capped:capped, cap:pen.aggregateCap*amt, debar:debar, capHit:raw>pen.aggregateCap*amt};
}
function contractKPIs(c){
  var k=contractAchieved(c);
  var p=recalc(c);
  var reps=c.reports||[]; var received=reps.filter(function(r){return r.received;}).length;
  var overdue=reps.filter(function(r){return rstatus(r)==='overdue';}).length;
  var next=reps.filter(function(r){return !r.received;}).map(function(r){return pd(r.due);}).filter(Boolean).sort(function(a,b){return a-b;})[0];
  return {achieved:k.achieved, committed:+c.committedLC||0, variance:k.variance, penalty:p.capped, penPct:(+c.amount?p.capped/c.amount*100:0), reps:reps.length, received:received, overdue:overdue, next:next, debar:p.debar.length>0, capHit:p.capHit};
}
function contractAchieved(c){ // latest actual from final or last periodic
  var reps=(c.reports||[]).filter(function(r){return (r.type==='periodic'||r.type==='final')&&r.received&&r.actual!=null;});
  var committed=+c.committedLC||0;
  if(!reps.length) return {achieved:null, variance:null};
  var last=reps[reps.length-1]; var a=+last.actual;
  return {achieved:a, variance:committed-a};
}

var ML = (typeof window!=='undefined' && window.LC_MANDATORY_LIST) ? window.LC_MANDATORY_LIST : [];
var ML_IDX=null;
function mlNorm(s){ s=String(s||'').toLowerCase();
  s=s.replace(/[ً-ٰٟـ]/g,'');                 // tashkeel + tatweel
  s=s.replace(/[إأآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي'); // unify
  s=s.replace(/[^0-9a-z؀-ۿ\s]/g,' ').replace(/\s+/g,' ').trim();
  return s; }
function mlToks(s){ return mlNorm(s).split(' ').filter(function(t){return t.length>1;}).map(function(t){ return t.replace(/^ال/,''); }).filter(function(t){return t.length>1;}); }
function mlBg(s){ s=mlNorm(s).replace(/\s/g,''); var g=[]; for(var i=0;i<s.length-1;i++)g.push(s.substr(i,2)); return g; }
function mlDice(a,b){ if(!a.length||!b.length)return 0; var m={},h=0; a.forEach(function(x){m[x]=(m[x]||0)+1;}); b.forEach(function(x){ if(m[x]>0){h++;m[x]--;} }); return 2*h/(a.length+b.length); }
function mlBuild(){ if(ML_IDX)return; ML_IDX=ML.map(function(o){ return {o:o, toks:mlToks((o.ne||'')+' '+(o.na||'')), bgE:mlBg(o.ne||''), bgA:mlBg(o.na||'')}; }); }
function mlMatch(query, topN){
  mlBuild(); var qN=mlNorm(query); if(!qN)return [];
  var qTok=mlToks(query), qBg=mlBg(query), qset={}; qTok.forEach(function(t){qset[t]=1;});
  if(!qTok.length && qN.length<3) return [];   // ignore 1–2 char / stop-word-only queries
  var res=ML_IDX.map(function(x){
    var shared=0; x.toks.forEach(function(t){ if(qset[t])shared++; });
    var overlap = qTok.length? shared/qTok.length : 0;
    var sub = ((x.o.ne&&mlNorm(x.o.ne).indexOf(qN)>=0)||(x.o.na&&mlNorm(x.o.na).indexOf(qN)>=0))?0.30:0;
    var fz = Math.max(mlDice(qBg,x.bgE), mlDice(qBg,x.bgA));
    return {o:x.o, score:Math.min(1,overlap*0.55 + fz*0.45 + sub)};
  });
  res.sort(function(a,b){return b.score-a.score;});
  return res.slice(0,topN||8).filter(function(r){return r.score>0.04;});
}

    mlidTopN=+$('#mlN').value||5;
    var items=mlBoQ.map(function(r,i){return {desc:(r.desc||'').trim(),qty:r.qty,unit:r.unit,i:i};}).filter(function(x){return x.desc;});
    var rcx=$('#mlResults');
    if(!items.length){ rcx.innerHTML='<div class="card pad"><div class="empty">'+L('Add at least one item with a description.','أضف بنداً واحداً على الأقل بوصف.')+'</div></div>'; return; }
    rcx.innerHTML='<div class="card pad"><div class="loading"><div class="lcm-spin"></div><div class="lt">'+L('Matching '+items.length+' line(s) against '+ML.length+' national products…','جارٍ مطابقة '+items.length+' بنداً مع '+ML.length+' منتجاً وطنياً…')+'</div></div></div>';
    setTimeout(function(){
      var box=el('div'), hit=0;
      items.forEach(function(it){
        var card=el('div','card pad'); card.style.marginBottom='14px';
        var res=mlMatch(it.desc,mlidTopN);
        var qtytxt=(it.qty?(' · '+esc(it.qty)+' '+esc(it.unit)):'');
        card.innerHTML='<div class="mlq"><span class="qn">'+(it.i+1)+'</span>'+L('Item','البند')+': “'+esc(it.desc)+'”'+qtytxt+(res.length?' <span class="pill st-ok" style="margin-inline-start:8px">'+L('match found','تمت المطابقة')+'</span>':' <span class="pill st-warn" style="margin-inline-start:8px">'+L('no match','لا مطابقة')+'</span>')+'</div>';
        if(!res.length){ card.appendChild(el('div','mech-card','<div class="md">'+L('No close match in the Mandatory List — this item may be outside the list.','لا توجد مطابقة قريبة في القائمة — قد يكون هذا البند خارج القائمة.')+'</div>')); box.appendChild(card); return; }
        hit++;
        var t=el('table','tbl');
        t.innerHTML='<thead><tr><th>#</th><th>'+L('Product name','اسم المنتج')+'</th><th>'+L('Product code','رمز المنتج')+'</th><th>'+L('Sector','القطاع')+'</th><th>'+L('Sector code','رمز القطاع')+'</th><th>'+L('Min LC','الحد الأدنى')+'</th><th>'+L('Match','المطابقة')+'</th></tr></thead>';
        var tbd=el('tbody');
        res.forEach(function(r,i){ var o=r.o; var nm=L(o.ne||o.na,o.na||o.ne); var alt=L(o.na,o.ne); var sec=L(o.se||o.sa,o.sa||o.se);
          var tr=el('tr'); if(i===0)tr.className='win';
          tr.innerHTML='<td><span class="badge-rank">'+(i+1)+'</span></td><td><b>'+(esc(nm)||'—')+'</b>'+(alt&&alt!==nm?'<div class="mtag">'+esc(alt)+'</div>':'')+'</td><td class="mono">'+(esc(o.pc)||'—')+'</td><td>'+(esc(sec)||'—')+'</td><td class="mono">'+(esc(o.sc)||'—')+'</td><td class="lcm-num">'+(o.mlc?o.mlc+'%':'—')+'</td><td><span class="matchbar"><i style="width:'+Math.round(r.score*100)+'%"></i></span> <span class="mtag">'+Math.round(r.score*100)+'%</span></td>';
          tbd.appendChild(tr); });
        t.appendChild(tbd); card.appendChild(t); box.appendChild(card);
      });
      var summary=el('div','card pad'); summary.style.marginBottom='14px';
      summary.innerHTML='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>'+L('Match summary','ملخص المطابقة')+':</b> <span class="pill st-neutral">'+items.length+' '+L('items','بنود')+'</span><span class="pill st-ok">'+hit+' '+L('matched','مطابَقة')+'</span><span class="pill st-warn">'+(items.length-hit)+' '+L('unmatched','بلا مطابقة')+'</span></div>';
      rcx.innerHTML=''; rcx.appendChild(summary); rcx.appendChild(box);
    }, 420);
  }
}

/* ===================== RULES PACK ===================== */
function renderRules(){
  var p=$('#page-rules'); var G=REGIMES.gov, P=REGIMES.pc;
  p.innerHTML='<div class="lcm-ph"><div class="lcm-eyebrow">'+L('Reference','المراجع')+'</div><h1>§ '+L('Rules Pack','حزمة الأنظمة')+'</h1><p>'+L('The parameters driving the engine, per sector. Highlighted cells are editable — changes persist in this browser and feed the Bid-Evaluation & Contract-Monitor engines. Sourced in LC-TOOL-RESEARCH.md.','المعايير التي تقود المحرّك لكل قطاع. الخلايا المظللة قابلة للتعديل — تُحفظ في المتصفح وتغذّي محرّكي تقييم العروض ومراقبة العقود. المصدر في LC-TOOL-RESEARCH.md.')+'</p></div>';
  var c=el('div','card pad');
  var pP=Math.round(G.priceWeight*100),lP=Math.round(G.lcWeight*100),pPc=Math.round(P.priceWeight*100),lPc=Math.round(P.lcWeight*100);
  var tP=Math.round(G.targetSplit*100),bP=Math.round(G.baselineSplit*100),tPc=Math.round(P.targetSplit*100),bPc=Math.round(P.baselineSplit*100);
  function re(rk,key,val,suf){ return '<td class="editable"><input class="rule-edit" type="number" min="0" max="100" data-rk="'+rk+'" data-key="'+key+'" value="'+val+'">% '+(suf||'')+'</td>'; }
  function row(lbl,g,pc){ return '<tr><td><b>'+lbl+'</b></td><td>'+g+'</td><td>'+pc+'</td></tr>'; }
  var html='<table class="tbl"><thead><tr><th>'+L('Parameter','المعيار')+'</th><th>'+L('Government','حكومي')+'</th><th>'+L('Portfolio Co. (MUSAHAMA)','شركة تابعة (مساهمة)')+'</th></tr></thead><tbody>';
  html+=row(L('Instrument','المرجع'),G.instrument,P.instrument);
  html+=row(L('High-value threshold','حد القيمة العالية'),'SAR '+fmt(G.highValue),'SAR '+fmt(P.highValue));
  html+='<tr><td><b>'+L('Price / LC weight','وزن السعر/المحتوى')+'</b></td>'+re('gov','priceWeight',pP,'/ <b>'+lP+'</b>% LC')+re('pc','priceWeight',pPc,'/ <b>'+lPc+'</b>% LC')+'</tr>';
  html+='<tr><td><b>'+L('Target / Baseline split','المستهدف/الأساس')+'</b></td>'+re('gov','targetSplit',tP,'/ <b>'+bP+'</b>% base')+re('pc','targetSplit',tPc,'/ <b>'+bPc+'</b>% base')+'</tr>';
  html+=row(L('Listed-company bonus','حافز المدرجة'),(G.listedBonus?'+'+(G.listedBonus*100)+'%':'—'),(P.listedBonus?'+'+(P.listedBonus*100)+'%':'—'));
  html+=row(L('National-product preference','أفضلية المنتج الوطني'),(G.nppPref*100)+'%',(P.nppPref*100)+'%');
  html+=row(L('SME preference','أفضلية المنشآت'),(G.smePref*100)+'%',(P.smePref*100)+'%');
  html+=row(L('Award gap cap','سقف فارق الترسية'),'≤'+(G.awardGapCap*100)+'%','≤'+(P.awardGapCap*100)+'%');
  html+=row(L('Gap fine trigger','حد الغرامة'),'>'+(G.pen.gapTrigger*100)+'%','>'+(P.pen.gapTrigger*100)+'%');
  html+='<tr><td><b>'+L('Per-fine cap','سقف الغرامة')+'</b></td>'+re('gov','perFineCap',Math.round(G.pen.perFineCap*100),'')+re('pc','perFineCap',Math.round(P.pen.perFineCap*100),'')+'</tr>';
  html+='<tr><td><b>'+L('Aggregate cap','السقف الإجمالي')+'</b></td>'+re('gov','aggregateCap',Math.round(G.pen.aggregateCap*100),'')+re('pc','aggregateCap',Math.round(P.pen.aggregateCap*100),'')+'</tr>';
  html+=row(L('Debar (single / repeat) LC','حرمان (مرة/متكرر)'),'>'+(G.pen.debarSingleLC*100)+'% / >'+(G.pen.debarRepeatLC*100)+'%','>'+(P.pen.debarSingleLC*100)+'% / >'+(P.pen.debarRepeatLC*100)+'%');
  html+=row(L('Plan deadline','مهلة الخطة'),G.planDays+' '+L('days','يوم'),P.planDays+' '+L('days','يوم'));
  html+=row(L('Annual LC report','التقرير السنوي'),L('per tender','حسب المنافسة'),P.reportingDeadline);
  html+=row(L('Final report deadline','مهلة التقرير النهائي'),L('Contract end','نهاية العقد'),L('Per contract (def. 30d)','حسب العقد (افتراضي 30ي)'));
  html+=row(L('Baseline cert validity','صلاحية شهادة الأساس'),G.baselineMonths+' '+L('months','شهر'),P.baselineMonths+' '+L('months','شهر')+' *');
  html+=row(L('Penalty mode','نمط الغرامات'),L('fixed (regulation)','مثبّت (نظام)'),L('configurable — edit caps above','قابل للتعديل — عدّل السقوف أعلاه'));
  html+='</tbody></table>';
  c.innerHTML=html; p.appendChild(c);
  var act=el('div',null,'<button class="btn" id="rReset">↺ '+L('Reset to defaults','إعادة الافتراضي')+'</button>'); act.style.marginTop='14px'; p.appendChild(act);
  p.appendChild(el('div','foot','<span>'+L('Editable cells persist locally and re-parameterize the engines instantly.','الخلايا القابلة للتعديل تُحفظ محلياً وتعيد ضبط المحرّكات فوراً.')+'</span><span>'+L('Gov defaults are regulation-set (raising fines/weights needs the relevant approval). MUSAHAMA delegates PC penalty caps to internal policy — edit them above.','الافتراضات الحكومية محددة نظاماً (رفع الغرامات/الأوزان يتطلب الموافقة). مساهمة تُفوّض سقوف غرامات الشركة لسياستها — عدّلها أعلاه.')+'</span><span>'+L('* cert validity & out-of-scope: PIF RHQ exclusion; Export & R&D LC bonuses (≤10pp).','* صلاحية الشهادة وخارج النطاق: استبعاد المقار الإقليمية؛ وحوافز التصدير والبحث والتطوير (≤10 نقاط).')+'</span>'));
  c.querySelectorAll('.rule-edit').forEach(function(inp){ inp.onchange=function(){ var rk=inp.getAttribute('data-rk'), key=inp.getAttribute('data-key'); var v=Math.max(0,Math.min(100,+inp.value||0)); setOv(rk,key,v/100); renderRules(); }; });
  $('#rReset').onclick=function(){ resetOv(); renderRules(); };
}

/* ===================== MODAL / NAV / BOOT ===================== */
function openModal(html){ $('#modal').innerHTML=html; $('#modalBg').classList.add('on'); }
function closeModal(){ $('#modalBg').classList.remove('on'); }
$('#modalBg').onclick=function(e){ if(e.target===$('#modalBg'))closeModal(); };
var curPage='dash';
function go(pg){ curPage=pg; document.querySelectorAll('.lcm-nav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-page')===pg);});
  document.querySelectorAll('.lcm-page').forEach(function(s){s.classList.remove('on');}); $('#page-'+pg).classList.add('on');
  if(pg==='dash')renderDash(); else if(pg==='mech')renderMech(); else if(pg==='eval')renderEval(); else if(pg==='monitor'){ if(monTab==='detail')monTab='list'; renderMonitor(); } else if(pg==='mlid')renderMlid(); else if(pg==='rules')renderRules(); window.scrollTo(0,0); }
function renderAll(){ applyStatic(); go(curPage); }
document.querySelectorAll('.lcm-nav a').forEach(function(a){ a.onclick=function(){ go(a.getAttribute('data-page')); }; });
$('#langBtn').onclick=function(){ lang=lang==='en'?'ar':'en'; lsSet('lcm_lang',lang); APP.classList.toggle('rtl',lang==='ar'); APP.setAttribute('dir',lang==='ar'?'rtl':'ltr'); $('#langBtn').textContent=lang==='en'?'ع':'EN'; REGIMES=buildREGIMES(); renderRegimeSel(); renderAll(); };
